name: Update Steam prices

on:
  schedule:
    # Дважды в сутки. GitHub запускает cron с задержкой в несколько часов,
    # поэтому точное время плавает — важен сам интервал.
    - cron: "17 4,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scripts/fetch_prices.py
        env:
          # Steam жёстко режет priceoverview, поэтому идём редко и не залипаем на повторах.
          SLEEP: 20
          ATTEMPTS: 2
          MISS_LIMIT: 99
          # Меньше интервала между прогонами, иначе второй переиспользует цены первого.
          REUSE_HOURS: 6
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Update Steam prices"
          git push
