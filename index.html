<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dota 2 — пики героев на крупных турнирах</title>
<style>
  :root {
    --bg: #0b0b0c;
    --panel: #141416;
    --panel2: #17171a;
    --line: #2a2a2e;
    --text: #f2f2f0;
    --muted: #8a8a90;
    --red: #e63329;
    --gold: #e63329;
    --green: #3fb27f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 "Helvetica Neue", Helvetica, Inter, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 44px 20px 24px;
    border-bottom: 2px solid var(--text);
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  h1 {
    margin: 0 0 10px;
    font-size: clamp(28px, 5vw, 46px);
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: -.03em;
    text-transform: uppercase;
  }
  h1 span { color: var(--red); }
  .sub {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .14em;
  }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    padding: 0 20px;
    border-bottom: 1px solid var(--line);
  }
  .tabs button {
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .1em;
    padding: 16px 18px 13px;
    margin-bottom: -1px;
    cursor: pointer;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button.on { color: var(--text); border-bottom-color: var(--red); }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    padding: 22px 20px 0;
  }
  select, input {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 10px 12px;
    font: inherit;
    font-size: 13px;
    outline: none;
  }
  select:focus, input:focus { border-color: var(--red); }
  select { min-width: 320px; }
  input { width: 220px; }
  [hidden] { display: none !important; }

  .stats {
    display: flex;
    gap: 12px 40px;
    flex-wrap: wrap;
    align-items: baseline;
    padding: 26px 20px 18px;
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .12em;
  }
  .stats b { color: var(--text); font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
  main { padding: 0 20px 80px; }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--muted);
    padding: 12px 8px;
    border-bottom: 2px solid var(--text);
    white-space: nowrap;
  }
  th[data-sort] { cursor: pointer; user-select: none; }
  th[data-sort]:hover { color: var(--text); }
  th.active { color: var(--red); }
  td { padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tbody tr:hover td { background: var(--panel); }
  .rank { color: var(--muted); width: 40px; font-variant-numeric: tabular-nums; }
  .hero { display: flex; align-items: center; gap: 12px; }
  .hero img {
    width: 52px; height: 29px;
    object-fit: cover;
    border-radius: 0;
    background: var(--panel2);
  }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .bar { position: relative; background: var(--panel2); border-radius: 0; height: 20px; min-width: 90px; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: var(--red); border-radius: 0; opacity: .8; }
  .bar span {
    position: relative; display: block; text-align: center;
    font-size: 12px; line-height: 18px; font-variant-numeric: tabular-nums;
  }
  .wr-hi { color: var(--green); }
  .wr-lo { color: #d9634f; }
  .dim { color: var(--muted); }
  .ellip { max-width: 380px; overflow: hidden; text-overflow: ellipsis; }
  .item { display: flex; align-items: center; gap: 10px; }
  .item img {
    width: 44px; height: 44px;
    object-fit: contain;
    border-radius: 0;
    background: var(--panel2);
    flex: none;
  }
  .item small { display: block; color: var(--muted); font-size: 11px; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; padding-bottom: 22px; }
  .acts button {
    background: none; color: var(--text);
    border: 1px solid var(--line);
    font: inherit; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .1em;
    padding: 10px 16px; cursor: pointer;
  }
  .acts button:hover { border-color: var(--red); color: var(--red); }
  .acts button.on { border-color: var(--red); color: var(--red); }
  .board { display: flex; flex-direction: column; gap: 26px; padding-top: 4px; }
  .brow { display: flex; gap: 22px; flex-wrap: wrap; }
  .bgroup { display: flex; flex-direction: column; gap: 8px; flex: 0 1 auto; min-width: 0; max-width: 100%; }
  .bgroup > h3 {
    margin: 0;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .14em;
    border-top: 2px solid var(--text);
    padding-top: 8px;
  }
  .bgroup > p { margin: 0 0 4px; color: var(--muted); font-size: 11px; max-width: 30ch; }
  .slots { display: flex; gap: 8px; flex-wrap: wrap; }
  .slot {
    position: relative;
    width: 132px; height: 150px;
    border: 1px solid var(--line);
    background: var(--panel);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px; padding: 10px; text-align: center;
  }
  .slot.filled { border-color: var(--red); }
  .slot big {
    font-size: 26px; font-weight: 800; letter-spacing: -.02em;
    color: var(--muted); line-height: 1;
  }
  .slot.filled big { color: var(--red); }
  .slot img { width: 46px; height: 46px; object-fit: contain; }
  .item-slot { width: 116px; height: 128px; gap: 6px; }
  .item-slot img { width: 62px; height: 46px; }
  .item-slot .nm { font-size: 11px; letter-spacing: .03em; white-space: normal; }
  .slot .nm { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
              overflow: hidden; text-overflow: ellipsis; width: 100%; }
  .slot .rec { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .slot select {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    min-width: 0;
    opacity: 0; cursor: pointer; border: none;
  }
  .gem { position: relative; flex: none; line-height: 0; }
  .gem i {
    position: absolute; right: -3px; bottom: -3px;
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--bg);
  }
  .price { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .price small { display: block; color: var(--muted); font-size: 11px; }
  .scroll.plain { border: none; }

  .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 0; }
  .matrix { border-collapse: separate; border-spacing: 0; }
  .matrix th, .matrix td { border-bottom: 1px solid #20242b; }
  .matrix thead th {
    position: sticky; top: 0;
    background: var(--bg);
    font-size: 11px;
    padding: 8px 6px;
    vertical-align: bottom;
  }
  .matrix thead th.cell {
    text-align: center;
    text-transform: none;
    letter-spacing: 0;
  }
  .matrix .name {
    position: sticky; left: 0;
    background: var(--bg);
    z-index: 2;
    min-width: 170px;
    border-right: 1px solid var(--line);
  }
  .matrix thead .name { z-index: 3; }
  .matrix tbody tr:hover .name { background: var(--panel); }
  .matrix td.cell {
    text-align: center;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    min-width: 46px;
    padding: 4px 3px;
  }
  .matrix td.cell small { display: block; font-size: 10px; opacity: .55; }
  .matrix td.thin { opacity: .35; }
  .matrix td.empty { color: #3a4048; }
  .matrix .col-total { border-left: 1px solid var(--line); font-weight: 600; }

  .msg { padding: 56px 20px; text-align: center; color: var(--muted); font-size: 13px;
         text-transform: uppercase; letter-spacing: .12em; }
  .msg.err { color: var(--red); }
  .note {
    padding: 18px 0 0;
    margin-top: 18px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
    max-width: 70ch;
  }
  footer {
    padding: 26px 20px 56px;
    color: var(--muted);
    font-size: 12px;
    border-top: 2px solid var(--text);
    max-width: 80ch;
  }
  a { color: var(--red); text-decoration: none; border-bottom: 1px solid currentColor; }
  a:hover { color: var(--text); }
  @media (max-width: 640px) {
    select, input { min-width: 0; width: 100%; }
    .hide-sm { display: none; }
    .tabs button { padding: 13px 12px 10px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>DOTA 2 — <span>пики героев</span> на крупных турнирах</h1>
    <div class="sub" id="sub">Загрузка…</div>
  </div>
</header>

<div class="wrap">
  <nav class="tabs">
    <button data-tab="tournaments" class="on">Турниры</button>
    <button data-tab="ti">The International 2026</button>
    <button data-tab="hero">Герой по турнирам</button>
    <button data-tab="matrix">Матрица</button>
    <button data-tab="prices">Цены Steam</button>
    <button data-tab="sockets">Аркана с гемом</button>
    <button data-tab="predict">Прогнозы на Инт</button>
    <button data-tab="builds">Сборки</button>
  </nav>

  <div class="controls">
    <select id="league" hidden></select>
    <select id="hero" hidden></select>
    <select id="group" hidden></select>
    <input id="search" type="search" autocomplete="off">
  </div>

  <div class="stats" id="stats"></div>
  <main>
    <div id="msg" class="msg">Загрузка данных…</div>
    <div id="view"></div>
  </main>
</div>

<footer class="wrap">
  Данные: <a href="https://www.opendota.com" target="_blank" rel="noopener">OpenDota API</a>.
  Учитываются только матчи 2026 года на актуальном патче, турниры уровня premium и professional.
  Контест = доля матчей, где герой был выбран или забанен.
  Цены — <a href="https://steamcommunity.com/market/search?appid=570" target="_blank" rel="noopener">Steam Community Market</a>,
  обновляются раз в сутки.
</footer>

<script>
const API = 'https://api.opendota.com/api';
const CDN = 'https://cdn.cloudflare.steamstatic.com';
const SEASON_START = "extract(epoch from date '2026-01-01')";
const TIERS = "l.tier IN ('premium', 'professional')";

const el = {
  league: document.getElementById('league'),
  hero: document.getElementById('hero'),
  group: document.getElementById('group'),
  search: document.getElementById('search'),
  stats: document.getElementById('stats'),
  msg: document.getElementById('msg'),
  view: document.getElementById('view'),
  sub: document.getElementById('sub'),
};

let heroes = {};
let leagues = [];
let tiLeagues = [];
let leagueById = {};
let rows = [];
let patch = '';
let totalMatches = 0;
let tab = 'tournaments';
const sort = {
  tournaments: { key: 'picks', dir: -1 },
  ti: { key: 'picks', dir: -1 },
  hero: { key: 'picks', dir: -1 },
  prices: { key: 'usd', dir: -1 },
  sockets: { key: 'usd', dir: 1 },
};

// Прогноз на групповой этап: слоты как в компендиуме, команды расставляет сам зритель.
const PREDICT_ROWS = [
  [
    { key: 'w40', title: '4–0', note: 'Команда без поражений', n: 1 },
    { key: 'w41', title: '4–1', note: 'Команды с четырьмя победами и одним поражением', n: 2 },
    { key: 'up', title: 'Проходят дальше', note: 'Пять команд, прошедших раунд на выбывание', n: 5 },
  ],
  [
    { key: 'out', title: 'Выбывают', note: 'Пять команд, проигравших раунд на выбывание', n: 5 },
    { key: 'l14', title: '1–4', note: 'Команды с одной победой и четырьмя поражениями', n: 2 },
    { key: 'l04', title: '0–4', note: 'Команда без побед', n: 1 },
  ],
];
const PREDICT_KEY = 'ti-predict-2026';

// Состав основного этапа задан списком: в данных OpenDota приглашённых команд нет,
// а у части участников название там другое — поэтому псевдонимы.
const TI_TEAMS = [
  { name: 'Aurora Gaming', alias: ['aurora gaming'] },
  { name: 'BetBoom Team', alias: ['boomboys', 'betboom team'] },
  { name: 'Team Falcons', alias: ['team falcons'] },
  { name: 'Team Liquid', alias: ['team liquid'] },
  { name: '1win Team', alias: ['iron wing', '1win team'] },
  { name: 'Xtreme Gaming', alias: ['xtreme gaming'] },
  { name: 'Team Yandex', alias: ['team yandex'] },
  { name: 'Team Resilience', alias: ['team resilience'] },
  { name: 'Vici Gaming', alias: ['vici gaming'] },
  { name: 'LGD Gaming', alias: ['lgd gaming'] },
  { name: 'OG', alias: ['og'] },
  { name: 'Team Spirit', alias: ['team spirit'] },
  { name: 'PARIVISION', alias: ['team vision', 'parivision'] },
  { name: 'L1GA TEAM', alias: ['huligani', 'l1ga team'] },
  { name: 'Nigma Galaxy', alias: ['nigma galaxy'] },
  { name: 'GamerLegion', alias: ['gamerlegion'] },
];

// Сборки: популярность предметов по стадиям игры, из профессиональных матчей OpenDota.
const BUILD_PHASES = [
  { key: 'start_game_items', title: 'Старт', note: 'Куплено до боя' },
  { key: 'early_game_items', title: 'Ранняя игра', note: 'Первые минуты на линии' },
  { key: 'mid_game_items', title: 'Середина', note: 'Основной костяк' },
  { key: 'late_game_items', title: 'Поздняя игра', note: 'Что собирают в конце' },
];
const plural = (n, one, few, many) => {
  const a = Math.abs(n) % 100, b = a % 10;
  return a > 10 && a < 20 ? many : b > 1 && b < 5 ? few : b === 1 ? one : many;
};

let items = null;
let builds = {};
let tiBuilds = {};
let buildSrc = 'all';
let buildsError = '';

let teams = null;
let teamsError = '';
let predict = {};
try { predict = JSON.parse(localStorage.getItem(PREDICT_KEY)) || {}; } catch { predict = {}; }

let prices = null;
let pricesError = '';

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtDate = ts => new Date(ts * 1000)
  .toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
const shorten = (s, n) => s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s;

const ABBR = [
  [/The International/gi, 'TI'],
  [/Esports World Cup/gi, 'EWC'],
  [/DreamLeague/gi, 'DL'],
  [/Regional Qualifiers?/gi, 'кв.'],
  [/Qualifiers?/gi, 'кв.'],
  [/Season\s*/gi, 'S'],
  [/Division/gi, 'Div'],
  [/\s20\d\d/g, ''],
];

function shortLeague(name) {
  const s = ABBR.reduce((acc, [re, to]) => acc.replace(re, to), name);
  return shorten(s.replace(/\s+/g, ' ').trim(), 17);
}

function sql(query) {
  return fetch(`${API}/explorer?sql=${encodeURIComponent(query)}`)
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(d => d.rows || []);
}

function showMsg(text, isError) {
  el.msg.textContent = text;
  el.msg.className = 'msg' + (isError ? ' err' : '');
  el.msg.hidden = false;
  el.view.innerHTML = '';
}

function wrColor(wr) {
  const h = Math.max(0, Math.min(130, (wr - 35) / 30 * 130));
  return `hsl(${h}, 50%, 26%)`;
}

function wrClass(wr) {
  return wr >= 55 ? 'wr-hi' : wr <= 45 ? 'wr-lo' : '';
}

async function init() {
  try {
    const [heroList, patchRows] = await Promise.all([
      fetch(`${API}/heroStats`).then(r => r.json()),
      sql(`SELECT mp.patch, count(*) AS n
           FROM match_patch mp JOIN matches m ON m.match_id = mp.match_id
           WHERE m.start_time >= extract(epoch from now() - interval '30 days')
           GROUP BY 1 ORDER BY n DESC LIMIT 1`),
    ]);

    heroes = Object.fromEntries(heroList.map(h => [h.id, h]));
    patch = patchRows[0]?.patch;
    if (!patch) throw new Error('не удалось определить актуальный патч');

    const where = `WHERE mp.patch = '${patch}'
                     AND m.start_time >= ${SEASON_START} AND ${TIERS}`;

    const [leagueRows, pickRows] = await Promise.all([
      sql(`SELECT l.leagueid, l.name,
                  count(distinct m.match_id) AS matches,
                  min(m.start_time) AS first_match, max(m.start_time) AS last_match
           FROM leagues l
           JOIN matches m ON m.leagueid = l.leagueid
           JOIN match_patch mp ON mp.match_id = m.match_id
           ${where}
           GROUP BY l.leagueid, l.name
           ORDER BY last_match DESC`),
      sql(`SELECT m.leagueid, pb.hero_id,
                  sum(CASE WHEN pb.is_pick THEN 1 ELSE 0 END) AS picks,
                  sum(CASE WHEN NOT pb.is_pick THEN 1 ELSE 0 END) AS bans,
                  sum(CASE WHEN pb.is_pick AND ((pb.team = 0 AND m.radiant_win)
                            OR (pb.team = 1 AND NOT m.radiant_win)) THEN 1 ELSE 0 END) AS wins
           FROM picks_bans pb
           JOIN matches m ON m.match_id = pb.match_id
           JOIN match_patch mp ON mp.match_id = m.match_id
           JOIN leagues l ON l.leagueid = m.leagueid
           ${where}
           GROUP BY 1, 2`),
    ]);

    if (!leagueRows.length) throw new Error('турниры на патче ' + patch + ' не найдены');

    leagues = leagueRows.map(l => ({
      id: String(l.leagueid),
      name: l.name,
      matches: Number(l.matches),
      first: Number(l.first_match),
      last: Number(l.last_match),
    }));
    leagueById = Object.fromEntries(leagues.map(l => [l.id, l]));
    totalMatches = leagues.reduce((s, l) => s + l.matches, 0);

    rows = pickRows.map(r => ({
      league: String(r.leagueid),
      hero: Number(r.hero_id),
      picks: Number(r.picks),
      bans: Number(r.bans),
      wins: Number(r.wins),
    }));

    el.sub.textContent = `Патч ${patch} · ${fmtDate(Math.min(...leagues.map(l => l.first)))}`
      + ` — ${fmtDate(Math.max(...leagues.map(l => l.last)))}`
      + ` · ${leagues.length} турниров, ${totalMatches} матчей`;

    tiLeagues = leagues.filter(l => /international 2026/i.test(l.name));

    const byPicks = aggregateHeroes(idsOf(leagues)).sort((a, b) => b.picks - a.picks);
    el.hero.innerHTML = byPicks
      .map(h => `<option value="${h.hero}">${esc(h.name)} — ${h.picks} пиков</option>`).join('');

    render();
  } catch (e) {
    showMsg('Не удалось загрузить данные: ' + e.message, true);
  }
}

const idsOf = list => new Set(list.map(l => l.id));

function scopeList() {
  return tab === 'ti' ? tiLeagues : leagues;
}

function currentScope() {
  const list = scopeList();
  const v = el.league.value;
  return v && v !== 'all' ? new Set([v]) : idsOf(list);
}

function syncLeagueSelect() {
  if (el.league.dataset.mode === tab) return;
  const list = scopeList();
  const total = list.reduce((s, l) => s + l.matches, 0);
  const label = tab === 'ti'
    ? `Все стадии TI 2026 — ${total} матчей`
    : `Все турниры — патч ${patch}`;
  el.league.innerHTML = `<option value="all">${label}</option>` +
    list.map(l => `<option value="${l.id}">${esc(l.name)} (${l.matches} матчей)</option>`).join('');
  el.league.dataset.mode = tab;
}

function heroName(id) {
  return heroes[id]?.localized_name || `Hero ${id}`;
}

function heroImg(id) {
  return heroes[id]?.img ? CDN + heroes[id].img : '';
}

function aggregateHeroes(ids) {
  const acc = new Map();
  let total = 0;
  for (const id of ids) total += leagueById[id].matches;
  for (const r of rows) {
    if (!ids.has(r.league)) continue;
    const cur = acc.get(r.hero) || { hero: r.hero, picks: 0, bans: 0, wins: 0 };
    cur.picks += r.picks;
    cur.bans += r.bans;
    cur.wins += r.wins;
    acc.set(r.hero, cur);
  }
  return [...acc.values()].map(h => ({
    ...h,
    name: heroName(h.hero),
    contest: (h.picks + h.bans) / total * 100,
    wr: h.picks ? h.wins / h.picks * 100 : 0,
  }));
}

function sortList(list, state) {
  const { key, dir } = state;
  return list.sort((a, b) => {
    const v = typeof a[key] === 'string' ? a[key].localeCompare(b[key]) * -1 : a[key] - b[key];
    return v * dir || (b.picks || 0) - (a.picks || 0);
  });
}

function header(cols, state) {
  return '<tr><th class="rank">#</th>' + cols.map(c =>
    `<th data-sort="${c.key}" class="${c.cls || ''} ${state.key === c.key ? 'active' : ''}">${c.label}</th>`
  ).join('') + '</tr>';
}

function renderTournaments() {
  if (tab === 'ti' && !tiLeagues.length) {
    el.stats.innerHTML = '';
    return showMsg(`Матчей The International 2026 на патче ${patch} пока нет`);

const ECON = 'https://community.fastly.steamstatic.com/economy/image';
const CURRENCY_COLS = [
  { key: 'usd', label: 'США, $' },
  { key: 'rub', label: 'Россия, ₽' },
];

const usd = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function priceNum(s) {
  if (!s) return 0;
  // Хвост обрезаем: точка из «руб.» иначе сойдёт за десятичный разделитель.
  const t = s.replace(/[^\d.,]/g, '').replace(/[.,]+$/, '');
  const dec = t.match(/[.,](\d{2})$/);
  const whole = (dec ? t.slice(0, -3) : t).replace(/[.,]/g, '');
  return Number(whole + (dec ? '.' + dec[1] : '')) || 0;
}

async function loadPrices() {
  try {
    const r = await fetch('prices.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    prices = {
      updated: data.updated,
      groups: data.groups || [],
      rate: data.rate || {},
      sockets: (data.sockets || []).map(s => ({
        name: s.gem, usd: s.usd, arcana: s.arcana, listings: 0,
        usdText: '$' + usd(s.usd), color: s.color || '',
        // Страница лотов считает в одной валюте, рубли для неё Steam не отдаёт.
        rub: data.rate?.rub ? s.usd * data.rate.rub : 0,
      })),
      items: data.items.map(it => {
        const row = {
          name: it.name, listings: it.listings || 0, icon: it.icon,
          type: it.type || '', groups: it.groups || [], socket: it.socket || '',
        };
        for (const c of CURRENCY_COLS) {
          const p = it.prices?.[c.key];
          const approx = p?.approx;
          row[c.key] = typeof p?.low === 'number' ? p.low : priceNum(p?.low);
          row[c.key + 'Text'] = approx
            ? '≈ ' + row[c.key].toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' руб.'
            : (p?.low || '');
          row[c.key + 'Median'] = approx ? 'пересчёт по курсу Steam' : (p?.median ? 'медиана ' + p.median : '');
          row[c.key + 'Approx'] = !!approx;
        }
        return row;
      }),
    };
  } catch (e) {
    pricesError = e.message;
  }
}

// Сборки именно с TI: у эндпоинта OpenDota разбивки по турнирам нет,
// поэтому итоговый инвентарь считаем сами по матчам этих лиг.
async function loadTiBuild(id) {
  buildsError = '';
  try {
    await loadItems();
    const where = `JOIN matches m ON m.match_id = pm.match_id
                   JOIN leagues l ON l.leagueid = m.leagueid
                   WHERE l.name ILIKE '%International 2026%' AND pm.hero_id = ${id}`;
    const [rows, cnt] = await Promise.all([
      sql(`SELECT item, count(*) AS n FROM (
             SELECT unnest(ARRAY[pm.item_0, pm.item_1, pm.item_2, pm.item_3, pm.item_4, pm.item_5]) AS item
             FROM player_matches pm ${where}
           ) s WHERE item > 0 GROUP BY 1 ORDER BY n DESC LIMIT 12`),
      sql(`SELECT count(*) AS n FROM player_matches pm ${where}`),
    ]);
    tiBuilds[id] = {
      picks: +(cnt[0]?.n || 0),
      list: rows.map(r => ({ id: r.item, n: +r.n, ...(items[r.item] || { name: '', img: '' }) }))
                .filter(i => i.name),
    };
  } catch (e) {
    buildsError = e.message;
  }
}

async function loadBuild(id) {
  buildsError = '';
  try {
    await loadItems();
    const d = await fetch(`${API}/heroes/${id}/itemPopularity`).then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    });
    builds[id] = BUILD_PHASES.map(p => ({
      ...p,
      list: Object.entries(d[p.key] || {})
        .map(([iid, n]) => ({ id: iid, n: +n, ...(items[iid] || { name: '', img: '' }) }))
        .filter(i => i.name)
        .sort((a, b) => b.n - a.n)
        .slice(0, 8),
    }));
  } catch (e) {
    buildsError = e.message;
  }
}

async function loadTeams() {
  try {
    const names = TI_TEAMS.flatMap(t => t.alias).map(a => `'${a}'`).join(', ');
    const win = `sum(CASE WHEN (tm.radiant AND m.radiant_win) OR (NOT tm.radiant AND NOT m.radiant_win)
                          THEN 1 ELSE 0 END)`;
    const [cards, quals] = await Promise.all([
      sql(`SELECT t.team_id, t.name, t.tag, max(t.logo_url) AS logo, count(tm.match_id) AS games
           FROM teams t LEFT JOIN team_match tm ON tm.team_id = t.team_id
           WHERE lower(trim(t.name)) IN (${names})
           GROUP BY 1, 2, 3`),
      sql(`SELECT tm.team_id, count(*) AS games, ${win} AS wins
           FROM team_match tm
           JOIN matches m ON m.match_id = tm.match_id
           JOIN leagues l ON l.leagueid = m.leagueid
           WHERE l.name ILIKE '%International 2026%'
           GROUP BY 1`),
    ]);

    // Рейтинг Elo лежит не в Explorer, а в отдельной точке API — это «общая сила» за всю историю.
    const rated = await fetch(`${API}/teams`).then(r => r.ok ? r.json() : []).catch(() => []);
    const rating = new Map(rated.map(r => [String(r.team_id), r]));

    const qual = new Map(quals.map(q => [String(q.team_id), q]));
    teams = TI_TEAMS.map((t, i) => {
      // Переименованная команда лежит в базе несколькими записями (HULIGANI и L1GA TEAM,
      // старая LGD и свежая под квалификации). Отбор берём из той, что играла отбор,
      // а рейтинг — из самой длинной истории: у свежей записи Elo начинается заново.
      const cand = cards.filter(c => t.alias.includes(String(c.name).trim().toLowerCase()));
      const hit = cand
        .slice()
        .sort((a, b) => (qual.has(String(b.team_id)) - qual.has(String(a.team_id))) || b.games - a.games)[0];
      const main = cand.slice().sort((a, b) => b.games - a.games)[0];
      const q = hit && qual.get(String(hit.team_id));
      return {
        id: hit ? String(hit.team_id) : 'x' + i,
        name: t.name,
        tag: hit ? (hit.tag || '').trim() : '',
        logo: hit ? hit.logo || '' : '',
        games: q ? +q.games : 0,
        wins: q ? +q.wins : 0,
        played: !!q,
        rating: main && rating.has(String(main.team_id))
          ? Math.round(rating.get(String(main.team_id)).rating) : null,
        // Сколько матчей стоит за рейтингом: на короткой истории Elo ничего не значит.
        rgames: main && rating.has(String(main.team_id))
          ? rating.get(String(main.team_id)).wins + rating.get(String(main.team_id)).losses : 0,
      };
    });
  } catch (e) {
    teamsError = e.message;
  }
}

      </div>`).join('') + `</div>`).join('') + '</div>' +
    `<div class="note">Групповой этап The International 2026, все ${teams.length} участников.
      Расставьте команды по местам сами: выбор сохраняется в этом браузере,
      одну команду нельзя поставить в два слота.
      Запись вида «9–5 в отборе» — результат в региональной квалификации;
      у приглашённых команд её нет, поэтому стоит «без отбора».
      «Расставить по общей силе» — рейтинг Elo из OpenDota, накопленный за всю историю команды.
      Знак «?» рядом с силой значит, что за рейтингом меньше сотни матчей: Elo привязан
      к записи в базе, а при переименовании она заводится заново и начинает с нуля.
      Такой рейтинг ничего не измеряет, поэтому при расстановке он подтягивается к среднему
      по составу — короткая история означает «неизвестно», а не «слабо».
      Это механический порядок, а не вероятность победы: основной этап ещё не сыгран,
      и предсказать его исход нельзя. Оценок аналитиков здесь нет — такого источника данных
      у сайта не подключено, а выдумывать их я не стану. Меняйте расстановку как хотите.</div>`;
  el.msg.hidden = true;
}

function renderSocketsTab() {
  if (pricesError) {
    el.stats.innerHTML = '';
    return showMsg(`Не удалось загрузить цены: ${pricesError}`, true);
  }
  if (!prices) {
    el.stats.innerHTML = '';
    showMsg('Загрузка цен…');
    loadPrices().then(() => { if (tab === 'sockets') render(); });
    return;
  }
  if (!prices.sockets.length) {
    el.stats.innerHTML = '';
    return showMsg('Состав лотов ещё не собран — появится после ближайшего обновления цен.');
  }
  renderSockets(el.search.value.trim().toLowerCase());
}

function renderSockets(q) {
  // Показываем ту аркану, в которой гем сидит, и помечаем её цветом самого гема.
  const icons = new Map(prices.items.map(i => [i.name, i.icon]));
  const list = sortList(prices.sockets.filter(s => !q || s.name.toLowerCase().includes(q)), sort.sockets);

  const dt = new Date(prices.updated);
  el.stats.innerHTML = `
    <div>Гемов: <b>${prices.sockets.length}</b></div>
    <div>Дешевле $50: <b>${prices.sockets.filter(s => s.usd < 50).length}</b></div>
    <div>Обновлено: <b>${isNaN(dt) ? '—' : dt.toLocaleString('ru-RU')}</b></div>`;

  if (!list.length) return showMsg('Ничего не найдено');

  const cols = [
    { key: 'name', label: 'Гем внутри' },
    { key: 'arcana', label: 'Вариант арканы' },
    { key: 'usd', label: 'Лот целиком, $', cls: 'price' },
    ...(prices.rate?.rub ? [{ key: 'rub', label: 'Лот целиком, ₽', cls: 'price' }] : []),
  ];

  el.view.innerHTML = `<div class="scroll plain"><table><thead>${header(cols, sort.sockets)}</thead><tbody>` +
    list.map((s, i) => `
      <tr>
        <td class="rank">${i + 1}</td>
        <td>
          <div class="item">
            ${icons.get(s.arcana) ? `<span class="gem">
              <img src="${ECON}/${esc(icons.get(s.arcana))}/62fx62f" alt="" loading="lazy">
              ${/^#[0-9a-f]{6}$/i.test(s.color) ? `<i style="background:${s.color}"></i>` : ''}
            </span>` : ''}
            <div class="ellip">${esc(s.name)}</div>
          </div>
        </td>
        <td><span class="dim">${esc(s.arcana)}</span></td>
        <td class="price">${esc(s.usdText)}</td>
        ${prices.rate?.rub ? `<td class="price">≈ ${s.rub.toLocaleString('ru-RU', { maximumFractionDigits: 0 })} руб.</td>` : ''}
      </tr>`).join('') + '</tbody></table></div>' +
    `<div class="note">Здесь одна покупка, а не две: гем уже вставлен в аркану, и цена — за лот целиком.
      ${prices.rate?.rub ? `Рубли Steam для страницы лотов не отдаёт — они пересчитаны из долларов
        по курсу ${prices.rate.rub.toLocaleString('ru-RU')} ₽ за $1, поэтому со знаком «≈».` : ''}
      Steam отдаёт по 20 лотов за раз, поэтому просматриваются самые дешёвые из них —
      редкий гем может не попасть в список, даже если такой лот существует.
      Список гемов, подходящих к аркане Terrorblade, взят из
      <a href="https://steamcommunity.com/sharedfiles/filedetails/?id=3336022190" target="_blank" rel="noopener">гайда в Steam</a>.</div>`;
  el.msg.hidden = true;
}

function renderPrices() {
  if (pricesError) {
    el.stats.innerHTML = '';
    return showMsg(`Не удалось загрузить цены: ${pricesError}`, true);
  }
  if (!prices) {
    el.stats.innerHTML = '';
    showMsg('Загрузка цен…');
    loadPrices().then(() => { if (tab === 'prices') render(); });
    return;
  }

  syncGroupSelect();
  const group = el.group.value;
  const q = el.search.value.trim().toLowerCase();
  const all = prices.items.filter(i => group === 'all' || i.groups.includes(group));

  const combo = group === 'terrorblade' || group === 'gems';
  let arcanaMin = 0;
  if (combo) {
    const variants = prices.items.filter(i => i.groups.includes('terrorblade') && !i.groups.includes('gems') && i.usd > 0);
    arcanaMin = variants.length ? Math.min(...variants.map(i => i.usd)) : 0;
    for (const i of all) i.combo = i.groups.includes('gems') ? arcanaMin + i.usd : i.usd;
  }

  const list = sortList(all.filter(i => !q || i.name.toLowerCase().includes(q)), sort.prices);

  const dt = new Date(prices.updated);
  el.stats.innerHTML = `
    <div>Предметов: <b>${all.length}</b></div>
    <div>Дороже $500: <b>${all.filter(i => i.usd >= 500).length}</b></div>
    <div>Всего лотов: <b>${all.reduce((s, i) => s + i.listings, 0)}</b></div>
    <div>Обновлено: <b>${isNaN(dt) ? '—' : dt.toLocaleString('ru-RU')}</b></div>`;

  if (!list.length) return showMsg('Ничего не найдено');

  const cols = [
    { key: 'name', label: 'Предмет' },
    { key: 'listings', label: 'Лотов', cls: 'num' },
    ...CURRENCY_COLS.map(c => ({ key: c.key, label: c.label, cls: 'price' })),
    ...(combo ? [{ key: 'combo', label: 'Аркана + гем, $', cls: 'price' }] : []),
  ];

  el.view.innerHTML = `<div class="scroll plain"><table><thead>${header(cols, sort.prices)}</thead><tbody>` +
    list.map((it, i) => `
      <tr>
        <td class="rank">${i + 1}</td>
        <td>
          <div class="item">
            <img src="${ECON}/${esc(it.icon)}/62fx62f" alt="" loading="lazy">
            <div><div class="ellip">${esc(it.name)}</div>
              ${it.type ? `<small>${esc(it.type)}</small>` : ''}
              ${it.socket ? `<small>в дешёвом лоте: ${esc(it.socket)}</small>` : ''}</div>
          </div>
        </td>
        <td class="num">${it.listings || '—'}</td>
        ${CURRENCY_COLS.map(c => `
          <td class="price">${it[c.key + 'Text'] ? esc(it[c.key + 'Text']) : '<span class="dim">нет данных</span>'}
            ${it[c.key + 'Median'] ? `<small>${esc(it[c.key + 'Median'])}</small>` : ''}</td>`).join('')}
        ${combo ? `<td class="price">${it.groups.includes('gems')
          ? `$${usd(it.combo)}<small>гем + аркана $${usd(arcanaMin)}</small>`
          : '<span class="dim">сама аркана</span>'}</td>` : ''}
      </tr>`).join('') + '</tbody></table></div>' +
    `<div class="note">Цены Steam Community Market, минимальная цена продажи с учётом комиссии.
      Обновляются автоматически раз в сутки.
      ${list.some(i => CURRENCY_COLS.some(c => i[c.key + 'Approx'])) ? `Цены со знаком «≈» Steam не отдал напрямую —
        они пересчитаны из долларов по курсу ${prices.rate.rub.toLocaleString('ru-RU')} ₽ за $1,
        выведенному из тех цен, которые он отдал.` : ''}
      ${combo ? `«Аркана + гем» — сумма двух отдельных лотов: самой дешёвой арканы ($${usd(arcanaMin)}) и гема.
        Steam не отдаёт состав конкретных лотов, поэтому «аркана уже с гемом внутри» одной покупкой здесь не считается.` : ''}
      Список гемов, подходящих к аркане Terrorblade, взят из
      <a href="https://steamcommunity.com/sharedfiles/filedetails/?id=3336022190" target="_blank" rel="noopener">гайда в Steam</a>.</div>`;
  el.msg.hidden = true;
}

function tiBanner() {
  if (tab !== 'ti') return '';
  const main = tiLeagues.find(l => !/qualifier/i.test(l.name));
  if (main) return '';
  return `<div class="note" style="padding:0 0 14px">Главный турнир ещё не начался — показаны
    региональные квалификации TI 2026. Основная сетка появится здесь автоматически, как только пройдут первые матчи.</div>`;
}

function render() {
  const byLeague = tab === 'tournaments' || tab === 'ti';
  el.league.hidden = !byLeague;
  el.hero.hidden = tab !== 'hero' && tab !== 'builds';
  el.group.hidden = tab !== 'prices';
  el.search.hidden = tab === 'predict' || tab === 'builds';
  el.search.placeholder = tab === 'hero' ? 'Поиск турнира…'
    : tab === 'prices' ? 'Поиск предмета…' : tab === 'sockets' ? 'Поиск гема…' : 'Поиск героя…';

  if (byLeague) {
    syncLeagueSelect();
    renderTournaments();
  } else if (tab === 'hero') renderHero();
  else if (tab === 'prices') renderPrices();
  else if (tab === 'sockets') renderSocketsTab();
  else if (tab === 'predict') renderPredict();
  else if (tab === 'builds') renderBuilds();
  else renderMatrix();
}

document.querySelector('.tabs').onclick = e => {
  const btn = e.target.closest('button[data-tab]');
  if (!btn || btn.dataset.tab === tab) return;
  tab = btn.dataset.tab;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b === btn));
  el.search.value = '';
  render();
};

el.view.onclick = e => {
  const th = e.target.closest('th[data-sort]');
  if (!th || !sort[tab]) return;
  const state = sort[tab];
  state.dir = th.dataset.sort === state.key ? -state.dir : -1;
  state.key = th.dataset.sort;
  render();
};

el.league.onchange = render;
el.hero.onchange = render;
el.group.onchange = () => {
  const g = el.group.value;
  sort.prices = g === 'terrorblade' || g === 'gems'
    ? { key: 'combo', dir: 1 }
    : { key: 'usd', dir: -1 };
  render();
};
el.search.oninput = render;

el.view.addEventListener('click', e => {
  const src = e.target.closest('.acts button[data-src]');
  if (src) {
    buildSrc = src.dataset.src;
    buildsError = '';
    return render();
  }
  const b = e.target.closest('.acts button');
  if (!b || !teams) return;
  if (b.dataset.act === 'clear') predict = {};
  else {
    // Порядок слотов — от лучшего места к худшему. Рейтинг на короткой истории
    // не измеряет силу, поэтому подтягиваем его к среднему тем сильнее, чем меньше матчей:
    // 24 матча — это «неизвестно», а не «слабо», и последнее место такой команде не место.
    const slots = PREDICT_ROWS.flat().flatMap(g => Array.from({ length: g.n }, (_, i) => `${g.key}${i}`));
    const rated = teams.filter(t => t.rating !== null);
    const mean = rated.reduce((s, t) => s + t.rating, 0) / (rated.length || 1);
    const K = 150;
    const score = t => t.rating === null ? mean
      : (t.rating * t.rgames + mean * K) / (t.rgames + K);
    const order = [...teams].sort((a, b2) => score(b2) - score(a));
    predict = {};
    slots.forEach((s, i) => { if (order[i]) predict[s] = order[i].id; });
  }
  savePredict();
  render();
});

el.view.onchange = e => {
  const s = e.target.closest('select[data-slot]');
  if (!s) return;
  if (s.value) predict[s.dataset.slot] = s.value;
  else delete predict[s.dataset.slot];
  savePredict();
  render();
};

init();
</script>
</body>
</html>
